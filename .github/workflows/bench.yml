name: Benchmark drift

on:
  schedule:
    - cron: '17 4 1 * *' # Origin: monthly exploratory cadence from picovoxel.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - run: pnpm run build:napi:bench
      - id: benchmark
        continue-on-error: true # Origin: monthly drift opens an issue; the PR-vs-main gate remains fail-closed.
        shell: bash # Origin: the default `bash -e` has no pipefail, so `| tee` swallowed an exceeded ceiling.
        env:
          # Origin: ubuntu-24.04 lavapipe medians. The first 250 ms ceiling held
          # through v4 (71.7 ms, 2026-09-01) but not v8's room IBL (744.1 ms,
          # 2026-10-01) or v11's default AO (705.6 ms, 2026-11-01); the missing
          # pipefail hid both failures. v12 adds the viewer's GTAO estimate,
          # denoise and upsample passes and the AO normal target: 923-1,256 ms
          # across the nanoraster#130 heads. v13's single-sample surfaces with
          # FXAA and analytic edges measured 1,666.8 ms at first admission
          # (2026-11-05). This admits that sample plus 26% for runner spread.
          MAX_MEDIAN_MS: '2100'
        run: |
          node bench/gated.mjs | tee benchmark.json
          node --expose-gc bench/presentation.mjs | tee presentation-benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monthly-benchmark
          path: |
            benchmark.json
            presentation-benchmark.json
      - if: steps.benchmark.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create claude \
            --color 5319E7 \
            --description 'Picked up by Claude automation' \
            --force
          gh issue create \
            --title 'Benchmark drift detected' \
            --body "Monthly benchmark drift failed in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            --label claude
      - if: steps.benchmark.outcome == 'failure'
        run: exit 1
