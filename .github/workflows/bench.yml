name: Benchmark drift

on:
  schedule:
    - cron: '17 4 1 * *' # Origin: monthly exploratory cadence from picovoxel.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - run: pnpm run build:napi:bench
      - id: benchmark
        continue-on-error: true # Origin: monthly drift opens an issue; the PR-vs-main gate remains fail-closed.
        env:
          MAX_MEDIAN_MS: '250' # Origin: 10x headroom over the extracted lavapipe spike; lower after five scheduled samples.
        run: |
          node bench/gated.mjs | tee benchmark.json
          node --expose-gc bench/presentation.mjs | tee presentation-benchmark.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-benchmark
          path: |
            benchmark.json
            presentation-benchmark.json
      - if: steps.benchmark.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create claude \
            --color 5319E7 \
            --description 'Picked up by Claude automation' \
            --force
          gh issue create \
            --title 'Benchmark drift detected' \
            --body "Monthly benchmark drift failed in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            --label claude
      - if: steps.benchmark.outcome == 'failure'
        run: exit 1
