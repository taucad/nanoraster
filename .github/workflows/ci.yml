name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACDMRT "origin/$BASE_REF...$SOURCE_SHA" > /tmp/changed-files
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACDMRT -r HEAD > /tmp/changed-files
          fi
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" \
            --ref "$REF_NAME" \
            --sha "$SOURCE_SHA" \
            --package-version "$(node -p "require('./package.json').version")" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files

  quality:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm nx run nanoraster:quality
      - run: node --test tests/ci-release.test.mjs tests/benchmark.test.mjs tests/release-attestations.test.mjs
      - name: Require a Version Plan for release-affecting changes
        if: needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pnpm nx release plan:check --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "::error::Cannot validate Version Plans without a previous push SHA"
              exit 1
            fi
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD || {
              echo "::error::Cannot validate Version Plans across a force-push"
              exit 1
            }
            pnpm nx release plan:check --base="$BEFORE_SHA" --head=HEAD
          else
            pnpm nx release plan:check --base=HEAD~1 --head=HEAD
          fi

  docs-prose:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm nx run nanoraster:docs-prose
      # Needs the exported site, which the docs-prose target has just built.
      - run: pnpm run docs:links

  node:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm nx run nanoraster:test
      - run: pnpm nx run nanoraster:typecheck

  native:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-gnu
          - os: macos-14
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - name: Install lavapipe software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: First-party Rust coverage
        run: pnpm run test:rust-coverage
      - name: Native singular/batch parity
        run: pnpm run test:native-parity
      - name: Pack platform candidate
        shell: bash
        run: |
          mkdir -p candidate-native
          npm pack "./npm/${{ matrix.target }}" --ignore-scripts --pack-destination candidate-native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.target }}
          path: candidate-native/*.tgz
          if-no-files-found: error

  candidate:
    needs: [preflight, quality, docs-prose, node, native]
    runs-on: ubuntu-24.04
    outputs:
      filename: ${{ steps.manifest.outputs.filename }}
      integrity: ${{ steps.manifest.outputs.integrity }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-*
          path: candidate
          merge-multiple: true
      - name: Install lavapipe software Vulkan
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - run: pnpm run build
      - run: pnpm run pkgcheck
      - run: pnpm run check:size
      - run: npm pack --ignore-scripts --pack-destination candidate
      - id: manifest
        run: node scripts/candidate-manifest.mjs candidate
      - name: Clean-room candidate consumer
        run: pnpm run test:package
        env:
          NANORASTER_CANDIDATE_DIR: candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-candidate
          path: candidate/
          if-no-files-found: error

  consumer:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: candidate
      - name: Install lavapipe software Vulkan
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - run: pnpm run test:package
        env:
          NANORASTER_CANDIDATE_DIR: candidate

  browser:
    name: browser (${{ matrix.browser }})
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: macos-14
          - browser: webkit
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: candidate
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Extract the exact root candidate
        run: |
          mkdir -p candidate/extracted
          tar -xzf "candidate/${{ needs.candidate.outputs.filename }}" -C candidate/extracted
      - name: Render through the candidate wasm in Vitest browser mode
        run: pnpm exec vitest run --config vitest.browser.config.ts
        env:
          BROWSER: ${{ matrix.browser }}
          NANORASTER_WASM_MODULE: candidate/extracted/package/dist/wasm/render_wasm.js

  benchmark:
    if: github.event_name == 'pull_request'
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - name: Benchmark the pull request
        run: |
          pnpm run build:napi
          node bench/gated.mjs > /tmp/current-benchmark.json
      - name: Benchmark main on the same runner
        shell: bash
        run: |
          base_directory="$(mktemp -d)"
          git worktree add --detach "$base_directory" 'origin/${{ github.base_ref }}'
          if [[ -f "$base_directory/bench/gated.mjs" ]]; then
            cd "$base_directory"
            pnpm install --frozen-lockfile
            pnpm run build:napi
            node bench/gated.mjs > /tmp/base-benchmark.json
          fi
      - id: compare
        continue-on-error: true # Origin: the following always-run comment must report the failed comparison before the gate closes.
        run: |
          base=/tmp/base-benchmark.json
          [[ -f "$base" ]] || base=-
          node scripts/compare-benchmark.mjs /tmp/current-benchmark.json "$base" /tmp/benchmark.md
      - name: Upsert benchmark comment
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- nanoraster-benchmark -->';
            const body = fs.readFileSync('/tmp/benchmark.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
      - if: steps.compare.outcome == 'failure'
        run: exit 1

  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: rust/Cargo.toml
          rust-version: 1.88.0
      - run: pnpm audit --audit-level high

  publish:
    if: needs.preflight.outputs.npm-publish == 'true'
    needs: [preflight, candidate, consumer, browser, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Publish exact candidates with provenance
        shell: bash
        run: |
          node -e "for (const p of require('./candidate/manifest.json').packages) console.log([p.name,p.version,p.filename,p.integrity].join('\t'))" > /tmp/packages
          while IFS=$'\t' read -r name version filename integrity; do
            published="$(npm view "$name@$version" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published" ]]; then
              if [[ "$published" != "$integrity" ]]; then
                echo "ERROR: registry integrity differs for $name@$version" >&2
                exit 1
              fi
              continue
            fi
            npm publish "./candidate/$filename" --access public --provenance
          done < /tmp/packages

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, candidate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate
          path: candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Verify registry bytes and provenance
        shell: bash
        run: |
          node -e "for (const p of require('./candidate/manifest.json').packages) console.log([p.name,p.version,p.integrity].join('\t'))" > /tmp/packages
          while IFS=$'\t' read -r name version integrity; do
            published="$(npm view "$name@$version" dist.integrity)"
            if [[ "$published" != "$integrity" ]]; then
              echo "ERROR: registry integrity differs for $name@$version" >&2
              exit 1
            fi
          done < /tmp/packages
          workspace="$PWD"
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          npm install --force --ignore-scripts \
            "nanoraster@${{ needs.preflight.outputs.version }}" \
            "nanoraster-darwin-arm64@${{ needs.preflight.outputs.version }}" \
            "nanoraster-linux-x64-gnu@${{ needs.preflight.outputs.version }}" \
            "nanoraster-win32-x64-msvc@${{ needs.preflight.outputs.version }}"
          npm audit signatures --json --include-attestations > /tmp/npm-audit-signatures.json
          cd "$workspace"
          node scripts/verify-release-attestations.mjs \
            /tmp/npm-audit-signatures.json \
            candidate/manifest.json \
            '${{ github.sha }}' \
            '${{ github.run_id }}'
      - name: Record the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v${{ needs.preflight.outputs.version }}'
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target '${{ github.sha }}' --generate-notes

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        quality,
        docs-prose,
        node,
        native,
        candidate,
        consumer,
        browser,
        benchmark,
        security,
        publish,
        registry-verify,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert required job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = ['preflight', 'quality', 'docs-prose', 'node', 'native', 'candidate', 'consumer', 'browser', 'security'];
          if (needs.preflight?.result === 'success' && process.env.PUBLISH === 'true') {
            required.push('publish', 'registry-verify');
          }
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          if (!['success', 'skipped'].includes(needs.benchmark?.result)) failures.push('benchmark');
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          NODE
