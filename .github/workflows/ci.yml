name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      npm-publish: ${{ steps.release.outputs.npm_publish }}
      version: ${{ steps.release.outputs.version }}
      smoke-matrix: ${{ steps.smoke.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --name-only --diff-filter=ACDMRT "origin/$BASE_REF...$SOURCE_SHA" > /tmp/changed-files
          else
            git diff-tree --no-commit-id --name-only --diff-filter=ACDMRT -r HEAD > /tmp/changed-files
          fi
          node scripts/ci-release.mjs \
            --event "$EVENT_NAME" \
            --ref "$REF_NAME" \
            --sha "$SOURCE_SHA" \
            --package-version "$(node -p "require('./package.json').version")" \
            --subject "$(git log -1 --pretty=%s "$SOURCE_SHA")" \
            --changed-files-file /tmp/changed-files
      # The runtime evidence matrix is data, not a static matrix: pull requests
      # run the fast rows only, while main, release, and manual runs add the
      # emulated and virtualized lanes that gate a release. A manual run is
      # evidence only — it derives `dispatch` from any ref and never publishes —
      # so a pull request can prove those lanes on its own branch before merge.
      - id: smoke
        env:
          EVENT_NAME: ${{ github.event_name }}
          KIND: ${{ steps.release.outputs.kind }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const kind = process.env.KIND;
          const event = process.env.EVENT_NAME;
          const slow = kind === 'main' || kind === 'release' || event === 'workflow_dispatch';
          const alpine = 'apk add --no-cache vulkan-loader mesa-vulkan-swrast';
          // Alpine 3.17's mesa 22.2 is the last lavapipe before the 32-bit ARM
          // break, and no current Alpine tag carries one. That repository is
          // end of life and is pinned for exactly one reason: it is the only
          // musl armv7 host on which this package can prove a render.
          const alpineMesa22 =
            "echo '@v317 https://dl-cdn.alpinelinux.org/alpine/v3.17/main' >> /etc/apk/repositories && apk add --no-cache vulkan-loader mesa-vulkan-swrast@v317";
          // The armv7 rows name the lavapipe manifest rather than let the
          // loader scan for it: the emulated 32-bit loader's non-LFS `readdir`
          // fails with EOVERFLOW on the host kernel's 64-bit `d_off`, so under
          // qemu-user it finds no driver at all. An emulation artefact, not a
          // consumer requirement; the glob spans bookworm's
          // `lvp_icd.armv8l.json` and trixie's `lvp_icd.json`.
          const debian =
            'apt-get update && apt-get install -y --no-install-recommends mesa-vulkan-drivers && export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)';
          // Mesa's lavapipe faults in `lvp_execute.c` `handle_vertex_buffers2`
          // on 32-bit ARM from mesa 23 onwards, replaying a vertex-buffer bind
          // through a stride pointer it never wrote, so the package refuses
          // device creation there with `driver-unsupported`. Each armv7
          // package therefore runs two rows: one on a host below the break,
          // which renders, and one above it, which asserts the refusal.
          // Official Node tarballs: the node images publish no ppc64le or s390x
          // tag on the current line, so those lanes install Node into Ubuntu.
          // Node 26 links `libatomic` on both (as does the Node 22 armhf
          // build), and `ubuntu:24.04` carries no such runtime of its own.
          const ubuntu = (version, arch) =>
            `apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libatomic1 xz-utils mesa-vulkan-drivers && curl -fsSL https://nodejs.org/dist/v${version}/node-v${version}-linux-${arch}.tar.xz | tar -xJ -C /usr/local --strip-components=1`;
          // Debian trixie carries mesa 25.0, past the lavapipe break, and
          // publishes no armv7 `node` image, so this row unpacks the official
          // Node tarball the way the ppc64le and s390x rows do and names the
          // ICD the same way the other Debian rows must.
          const debianTrixie = `${ubuntu('22.23.2', 'armv7l')} && export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)`;
          const rows = [
            { suffix: 'darwin-arm64', lane: '22.13.0', os: 'macos-latest', recipe: 'host', timeout: 30 },
            { suffix: 'darwin-arm64', lane: '26', os: 'macos-latest', recipe: 'host', timeout: 30 },
            { suffix: 'win32-x64-msvc', lane: '22.13.0', os: 'windows-2022', recipe: 'host', timeout: 30 },
            { suffix: 'win32-x64-msvc', lane: '26', os: 'windows-2022', recipe: 'host', timeout: 30 },
            { suffix: 'win32-ia32-msvc', lane: '22.13.0', os: 'windows-2022', recipe: 'host', arch: 'x86', timeout: 30 },
            { suffix: 'win32-ia32-msvc', lane: '22', os: 'windows-2022', recipe: 'host', arch: 'x86', timeout: 30 },
            { suffix: 'win32-arm64-msvc', lane: '22.13.0', os: 'windows-11-arm', recipe: 'host', timeout: 30 },
            { suffix: 'win32-arm64-msvc', lane: '26', os: 'windows-11-arm', recipe: 'host', timeout: 30 },
            { suffix: 'linux-x64-gnu', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'host', timeout: 30 },
            { suffix: 'linux-x64-gnu', lane: '26', os: 'ubuntu-24.04', recipe: 'host', timeout: 30 },
            { suffix: 'linux-arm64-gnu', lane: '22.13.0', os: 'ubuntu-24.04-arm', recipe: 'host', timeout: 30 },
            { suffix: 'linux-arm64-gnu', lane: '26', os: 'ubuntu-24.04-arm', recipe: 'host', timeout: 30 },
            { suffix: 'linux-x64-musl', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', platform: 'linux/amd64', image: 'node:22.13.0-alpine', setup: alpine, timeout: 30 },
            { suffix: 'linux-x64-musl', lane: '26', os: 'ubuntu-24.04', recipe: 'container', platform: 'linux/amd64', image: 'node:26-alpine', setup: alpine, timeout: 30 },
            { suffix: 'linux-arm64-musl', lane: '22.13.0', os: 'ubuntu-24.04-arm', recipe: 'container', platform: 'linux/arm64', image: 'node:22.13.0-alpine', setup: alpine, timeout: 30 },
            { suffix: 'linux-arm64-musl', lane: '26', os: 'ubuntu-24.04-arm', recipe: 'container', platform: 'linux/arm64', image: 'node:26-alpine', setup: alpine, timeout: 30 },
            { suffix: 'darwin-x64', lane: '22.13.0', os: 'macos-15-intel', recipe: 'host', slow: true, timeout: 30 },
            { suffix: 'darwin-x64', lane: '26', os: 'macos-15-intel', recipe: 'host', slow: true, timeout: 30 },
            { suffix: 'linux-arm-gnueabihf', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/arm/v7', image: 'node:22.13.0-bookworm-slim', setup: debian, slow: true, timeout: 45 },
            { suffix: 'linux-arm-gnueabihf', lane: '22', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/arm/v7', image: 'debian:trixie-slim', setup: debianTrixie, expectRenderError: 'driver-unsupported', slow: true, timeout: 45 },
            { suffix: 'linux-arm-musleabihf', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/arm/v7', image: 'node:22.13.0-alpine', setup: alpineMesa22, slow: true, timeout: 45 },
            { suffix: 'linux-arm-musleabihf', lane: '22', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/arm/v7', image: 'node:22-alpine', setup: alpine, expectRenderError: 'driver-unsupported', slow: true, timeout: 45 },
            { suffix: 'linux-ppc64-gnu', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/ppc64le', image: 'ubuntu:24.04', setup: ubuntu('22.13.0', 'ppc64le'), slow: true, timeout: 45 },
            { suffix: 'linux-ppc64-gnu', lane: '26', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/ppc64le', image: 'ubuntu:24.04', setup: ubuntu('26.7.0', 'ppc64le'), slow: true, timeout: 45 },
            { suffix: 'linux-s390x-gnu', lane: '22.13.0', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/s390x', image: 'ubuntu:24.04', setup: ubuntu('22.13.0', 's390x'), slow: true, timeout: 45 },
            { suffix: 'linux-s390x-gnu', lane: '26', os: 'ubuntu-24.04', recipe: 'container', qemu: true, platform: 'linux/s390x', image: 'ubuntu:24.04', setup: ubuntu('26.7.0', 's390x'), slow: true, timeout: 45 },
            { suffix: 'freebsd-x64', lane: '22', os: 'ubuntu-24.04', recipe: 'freebsd', slow: true, timeout: 45 },
          ];
          const selected = rows.filter((row) => slow || !row.slow);
          console.log(`matrix=${JSON.stringify(selected)}`);
          NODE

  quality:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm nx run nanoraster:quality
      - run: >-
          node --test
          tests/ci-release.test.mjs
          tests/benchmark.test.mjs
          tests/release-attestations.test.mjs
          tests/workflow-policy.test.mjs
          tests/compatibility.test.mjs
          tests/test-package.test.mjs
          tests/inspect-native.test.mjs
          tests/check-prepared-release.test.mjs
          tests/napi-targets.test.mjs
          tests/pack-test-tarballs.test.mjs
          tests/registry-wait.test.mjs
      - name: Require a Version Plan for release-affecting changes
        if: needs.preflight.outputs.kind != 'release-pull-request' && needs.preflight.outputs.kind != 'release'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            pnpm nx release plan:check --base="origin/$BASE_REF" --head=HEAD
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
              echo "::error::Cannot validate Version Plans without a previous push SHA"
              exit 1
            fi
            git merge-base --is-ancestor "$BEFORE_SHA" HEAD || {
              echo "::error::Cannot validate Version Plans across a force-push"
              exit 1
            }
            pnpm nx release plan:check --base="$BEFORE_SHA" --head=HEAD
          else
            pnpm nx release plan:check --base=HEAD~1 --head=HEAD
          fi

  docs-prose:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: pnpm nx run nanoraster:docs-prose
      # Needs the exported site, which the docs-prose target has just built.
      - run: pnpm run docs:links

  node:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '26']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Install lavapipe software Vulkan
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - run: pnpm nx run nanoraster:test
      - run: pnpm nx run nanoraster:typecheck

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            representative: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            representative: true
          - target: aarch64-pc-windows-msvc
            os: windows-2022
          - target: i686-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            cross: '--use-napi-cross'
            representative: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            cross: '--use-napi-cross'
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-24.04
            cross: '--use-napi-cross'
          - target: powerpc64le-unknown-linux-gnu
            os: ubuntu-24.04
            cross: '--use-napi-cross'
          - target: s390x-unknown-linux-gnu
            os: ubuntu-24.04
            cross: '--use-napi-cross'
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            cross: '-x'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            cross: '-x'
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04
            cross: '-x'
          - target: aarch64-linux-android
            os: ubuntu-24.04
          - target: armv7-linux-androideabi
            os: ubuntu-24.04
          - target: x86_64-unknown-freebsd
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      # The NAPI-RS template's floor; rustc raises arm64 macOS to its own 11.0.
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: matrix.target != 'x86_64-unknown-freebsd'
        with:
          node-version: '26'
      - name: Add the Rust target
        if: matrix.target != 'x86_64-unknown-freebsd'
        run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.cross == '-x'
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        if: matrix.cross == '-x'
        with:
          tool: cargo-zigbuild
      - name: Relax link-time optimization for the i686 MSVC link
        if: matrix.target == 'i686-pc-windows-msvc'
        shell: bash
        run: |
          {
            echo 'CARGO_PROFILE_RELEASE_LTO=false'
            echo 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=32'
          } >> "$GITHUB_ENV"
      - name: Build the addon
        if: matrix.target != 'x86_64-unknown-freebsd'
        shell: bash
        run: |
          pnpm exec napi build --platform --release --esm --js index.js --dts index.d.ts \
            --output-dir src/native --manifest-path rust/render-napi/Cargo.toml \
            --target ${{ matrix.target }} ${{ matrix.cross }} -- --locked
      - uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963 # v1.4.0
        if: matrix.target == 'x86_64-unknown-freebsd'
        with:
          operating_system: freebsd
          version: '15.0'
          memory: 8G
          cpu_count: 3
          shell: bash
      - name: Build the addon inside the FreeBSD virtual machine
        if: matrix.target == 'x86_64-unknown-freebsd'
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: |
          set -euo pipefail
          # The FreeBSD package repository targets the newest minor of a major
          # release line, so a 15.0 guest must accept the recorded version skew.
          export IGNORE_OSVERSION=yes
          export RUSTUP_IO_THREADS=1
          sudo -E pkg install --yes node22 npm-node22 curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          sudo npm install --global pnpm@11.7.0
          # The virtual machine only runs the NAPI-RS build, and Playwright's
          # install script has no FreeBSD download.
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec napi build --platform --release --esm --js index.js --dts index.d.ts \
            --output-dir src/native --manifest-path rust/render-napi/Cargo.toml \
            --target x86_64-unknown-freebsd -- --locked
      - name: Collect the FreeBSD addon
        if: matrix.target == 'x86_64-unknown-freebsd'
        shell: cpa.sh {0} --sync-files vm-to-runner
        run: rm -rf node_modules rust/target docs-site/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bindings-${{ matrix.target }}
          path: src/native/nanoraster.*.node
          if-no-files-found: error
          retention-days: 1
      - name: Install lavapipe software Vulkan
        if: matrix.representative && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - name: Clippy
        if: matrix.representative
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Clippy with the bench feature
        if: matrix.representative
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: First-party Rust coverage
        if: matrix.representative
        run: pnpm run test:rust-coverage
      - name: Native singular/batch parity
        if: matrix.representative
        run: pnpm run test:native-parity

  assemble:
    needs: [preflight, quality, docs-prose, node, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      archive: ${{ steps.freeze.outputs.archive }}
      sha256: ${{ steps.freeze.outputs.sha256 }}
      version: ${{ steps.freeze.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true
      - run: pnpm run build
      - name: Assert the shipped entry graphs
        env:
          NANORASTER_REQUIRE_DIST: '1'
        run: pnpm exec vitest run tests/import-graph.test.mjs
      # Every `pnpm run` must precede `napi pre-publish`: it rewrites the source
      # manifest's optionalDependencies, after which pnpm's pre-run dependency
      # check refuses the now-stale lockfile. From there on only `node` runs.
      - run: pnpm run pkgcheck
      - run: pnpm run check:size
      - name: Build the bench-enabled wasm sibling for the conformance gate
        run: pnpm run build:wasm:bench
      - name: Generate the sixteen platform directories
        run: pnpm exec napi create-npm-dirs --npm-dir npm
      - name: Collect the native addons
        run: pnpm exec napi artifacts --output-dir artifacts --npm-dir npm
      - name: Copy the physical license into every platform package
        run: |
          for directory in npm/*/; do
            cp license "$directory"
          done
      - name: Inspect every native binary
        env:
          # The Darwin build rows pin the same target; the inspector raises its
          # expected x64 floor to it (arm64 is floored at 11.0 by the toolchain).
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: node scripts/inspect-native.mjs
      - name: Reconcile the platform manifests without publishing
        run: pnpm exec napi pre-publish --skip-optional-publish -t npm --no-gh-release
      - name: Assert the prepared release is complete
        run: node scripts/check-prepared-release.mjs
      - name: Pack the frozen test tarballs
        run: node scripts/pack-test-tarballs.mjs --out tarballs
      - run: node scripts/validate-pack.mjs
      - id: freeze
        name: Freeze the prepared release tree
        run: |
          version="$(node -p "require('./package.json').version")"
          rm -rf prepared
          mkdir -p prepared/scripts
          node <<'NODE'
          const { cpSync, existsSync } = require('node:fs');
          const entries = [...require('./package.json').files, 'package.json', 'npm', 'test-tarballs.json'];
          for (const entry of entries) {
            if (!existsSync(entry)) throw new Error(`prepared release is missing ${entry}`);
            cpSync(entry, `prepared/${entry}`, { recursive: true });
          }
          NODE
          cp scripts/validate-pack.mjs scripts/package-files.mjs prepared/scripts/
          archive="prepared-release-$version.tgz"
          tar -czf "$archive" -C prepared .
          sha256sum "$archive" > "$archive.sha256"
          size="$(wc -c < "$archive")"
          if [[ "$size" -gt 167772160 ]]; then
            echo "::error::prepared release archive is $size bytes, above the 160 MB ceiling"
            exit 1
          fi
          {
            echo "archive=$archive"
            echo "sha256=$(cut -d' ' -f1 < "$archive.sha256")"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-release
          path: |
            prepared-release-*.tgz
            prepared-release-*.tgz.sha256
          if-no-files-found: error
          retention-days: ${{ needs.preflight.outputs.kind == 'release' && 30 || 1 }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-tarballs
          path: tarballs/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-bench
          path: tests/out/wasm-bench/
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke (${{ matrix.suffix }}, ${{ matrix.lane }})
    needs: [preflight, assemble]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.smoke-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.recipe == 'host'
        with:
          node-version: ${{ matrix.lane }}
          architecture: ${{ matrix.arch }}
      - name: Install lavapipe software Vulkan
        if: matrix.recipe == 'host' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - name: Render from the frozen tarballs
        if: matrix.recipe == 'host'
        env:
          NANORASTER_NATIVE_SUFFIX: ${{ matrix.suffix }}
          NANORASTER_TARBALL_DIR: tarballs
        run: node scripts/test-package.mjs
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: matrix.qemu
      - name: Render from the frozen tarballs in a container
        if: matrix.recipe == 'container'
        env:
          EXPECT_RENDER_ERROR: ${{ matrix.expectRenderError }}
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          SETUP: ${{ matrix.setup }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            --volume "$PWD:/nanoraster" --workdir /nanoraster \
            --env NANORASTER_TARBALL_DIR=tarballs \
            --env NANORASTER_NATIVE_SUFFIX="$SUFFIX" \
            --env NANORASTER_SMOKE_EXPECT_RENDER_ERROR="$EXPECT_RENDER_ERROR" \
            "$IMAGE" sh -c "$SETUP && node scripts/test-package.mjs"
      - uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963 # v1.4.0
        if: matrix.recipe == 'freebsd'
        with:
          operating_system: freebsd
          version: '15.0'
          memory: 8G
          cpu_count: 3
          shell: bash
      - name: Render from the frozen tarballs inside the FreeBSD virtual machine
        if: matrix.recipe == 'freebsd'
        shell: cpa.sh {0} --sync-files runner-to-vm
        run: |
          set -euo pipefail
          export IGNORE_OSVERSION=yes
          sudo -E pkg install --yes node22 npm-node22 vulkan-loader mesa-dri
          export NANORASTER_NATIVE_SUFFIX=freebsd-x64
          export NANORASTER_TARBALL_DIR=tarballs
          export VK_DRIVER_FILES=/usr/local/share/vulkan/icd.d/lvp_icd.x86_64.json
          node scripts/test-package.mjs

  browser:
    name: browser (${{ matrix.browser }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: macos-14
          - browser: webkit
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: wasm-bench
          path: tests/out/wasm-bench
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Extract the frozen root tarball
        run: |
          mkdir -p tarballs/extracted
          tar -xzf "tarballs/$(node -p "require('./tarballs/test-tarballs.json').packages.nanoraster.filename")" \
            -C tarballs/extracted
      - name: Render through the frozen wasm in Vitest browser mode
        run: pnpm exec vitest run --config vitest.browser.config.ts
        env:
          BROWSER: ${{ matrix.browser }}
          NANORASTER_ROOT_PACKAGE: tarballs/extracted/package
          NANORASTER_WASM_MODULE: tarballs/extracted/package/dist/wasm/render_wasm.js

  benchmark:
    if: github.event_name == 'pull_request'
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - name: Benchmark the pull request
        run: |
          pnpm run build:napi:bench
          node bench/gated.mjs > /tmp/current-benchmark.json
      - name: Benchmark main on the same runner
        shell: bash
        run: |
          base_directory="$(mktemp -d)"
          git worktree add --detach "$base_directory" 'origin/${{ github.base_ref }}'
          if [[ -f "$base_directory/bench/gated.mjs" ]]; then
            cd "$base_directory"
            pnpm install --frozen-lockfile
            # The base may predate the bench cargo feature, whose sibling addon
            # the benchmark now loads; build whichever addon that tree expects.
            if node -e "process.exit(require('./package.json').scripts['build:napi:bench'] ? 0 : 1)"; then
              pnpm run build:napi:bench
            else
              pnpm run build:napi
            fi
            node bench/gated.mjs > /tmp/base-benchmark.json
          fi
      - id: compare
        continue-on-error: true # Origin: the following always-run comment must report the failed comparison before the gate closes.
        run: |
          base=/tmp/base-benchmark.json
          [[ -f "$base" ]] || base=-
          node scripts/compare-benchmark.mjs /tmp/current-benchmark.json "$base" /tmp/benchmark.md
      - name: Upsert benchmark comment
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- nanoraster-benchmark -->';
            const body = fs.readFileSync('/tmp/benchmark.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
      - if: steps.compare.outcome == 'failure'
        run: exit 1

  security:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: rust/Cargo.toml
          rust-version: 1.88.0
      - run: pnpm audit --audit-level high

  publish:
    if: needs.preflight.outputs.npm-publish == 'true'
    needs: [preflight, assemble, smoke, browser, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '26'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: prepared-release
          path: prepared-release
          expect: ${{ needs.assemble.outputs.archive }} ${{ needs.assemble.outputs.archive }}.sha256
      - name: Extract the frozen release tree
        env:
          ARCHIVE: ${{ needs.assemble.outputs.archive }}
        run: |
          cd prepared-release
          sha256sum --check "$ARCHIVE.sha256"
          cd ..
          mkdir -p release
          tar -xzf "prepared-release/$ARCHIVE" -C release
      - name: Validate the frozen release tree
        working-directory: release
        run: node scripts/validate-pack.mjs
      - name: Publish the sixteen platform packages
        run: pnpm exec napi pre-publish --cwd release -t npm --no-gh-release
      - name: Publish the root package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [[ "$(npm view "nanoraster@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
            echo "nanoraster@$VERSION is already published"
            exit 0
          fi
          if ! output="$(npm publish ./release 2>&1)"; then
            echo "$output"
            grep --quiet 'cannot publish over the previously published versions' <<<"$output" || exit 1
            echo "nanoraster@$VERSION was already published"
            exit 0
          fi
          echo "$output"

  registry-verify:
    if: always() && needs.preflight.outputs.npm-publish == 'true' && needs.publish.result == 'success'
    needs: [preflight, assemble, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-verified-artifact
        with:
          name: test-tarballs
          path: tarballs
          expect: test-tarballs.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      - name: Wait for the registry to serve every published package
        run: node scripts/registry-wait.mjs --tarballs tarballs/test-tarballs.json --interval-seconds 30 --timeout-minutes 30
      - name: Install every package and verify its attestation
        run: |
          workspace="$PWD"
          node <<'NODE' > /tmp/specifiers
          const { packages, version } = require('./tarballs/test-tarballs.json');
          console.log(Object.keys(packages).sort().map((name) => `${name}@${version}`).join(' '));
          NODE
          directory="$(mktemp -d)"
          cd "$directory"
          npm init --yes >/dev/null
          xargs npm install --force --ignore-scripts < /tmp/specifiers
          npm audit signatures --json --include-attestations > /tmp/npm-audit-signatures.json
          cd "$workspace"
          node scripts/verify-release-attestations.mjs \
            /tmp/npm-audit-signatures.json \
            tarballs/test-tarballs.json \
            '${{ github.sha }}' \
            '${{ github.run_id }}'

  # The armv7 row is the only host where npm keeps two platform packages: the
  # `eabihf` ABI carries no `libc` selector, so both armv7 packages install and
  # the loader picks one at runtime. It runs emulated, like its `smoke`
  # counterpart, and names the lavapipe manifest for the same qemu-user
  # `readdir` artefact. `label` rather than `os` names the job because two rows
  # now run on `ubuntu-24.04`.
  registry-smoke:
    name: registry-smoke (${{ matrix.label }})
    needs: [preflight, registry-verify]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-gnu
            os: ubuntu-24.04
            recipe: host
            suffix: linux-x64-gnu
          - label: darwin-arm64
            os: macos-latest
            recipe: host
            suffix: darwin-arm64
          - label: win32-x64-msvc
            os: windows-2022
            recipe: host
            suffix: win32-x64-msvc
          - label: linux-arm-gnueabihf-qemu
            os: ubuntu-24.04
            recipe: container
            suffix: linux-arm-gnueabihf
            platform: linux/arm/v7
            image: node:22-bookworm-slim
    runs-on: ${{ matrix.os }}
    env:
      NANORASTER_NATIVE_SUFFIX: ${{ matrix.suffix }}
      NANORASTER_REGISTRY_VERSION: ${{ needs.preflight.outputs.version }}
      NAPI_RS_ENFORCE_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.recipe == 'host'
        with:
          node-version: '26'
      - name: Install lavapipe software Vulkan
        if: matrix.recipe == 'host' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers
      - name: Install the published package the way a consumer does
        if: matrix.recipe == 'host'
        run: node scripts/test-package.mjs
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        if: matrix.recipe == 'container'
      - name: Install the published package the way a consumer does in a container
        if: matrix.recipe == 'container'
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            --volume "$PWD:/nanoraster" --workdir /nanoraster \
            --env NANORASTER_NATIVE_SUFFIX \
            --env NANORASTER_REGISTRY_VERSION \
            --env NAPI_RS_ENFORCE_VERSION_CHECK \
            "$IMAGE" sh -c 'apt-get update && apt-get install -y --no-install-recommends mesa-vulkan-drivers && export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json) && node scripts/test-package.mjs'

  registry-release:
    if: always() && needs.registry-smoke.result == 'success'
    needs: [preflight, registry-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Record the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          tag="v$VERSION"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --target '${{ github.sha }}' --generate-notes

  ci-gate:
    if: always()
    needs:
      [
        preflight,
        quality,
        docs-prose,
        node,
        build,
        assemble,
        smoke,
        browser,
        benchmark,
        security,
        publish,
        registry-verify,
        registry-smoke,
        registry-release,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Assert required job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          PUBLISH: ${{ needs.preflight.outputs.npm-publish }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RESULTS);
          const required = ['preflight', 'quality', 'docs-prose', 'node', 'build', 'assemble', 'smoke', 'browser', 'security'];
          if (needs.preflight?.result === 'success' && process.env.PUBLISH === 'true') {
            required.push('publish', 'registry-verify', 'registry-smoke', 'registry-release');
          }
          const failures = required.filter((name) => needs[name]?.result !== 'success');
          if (!['success', 'skipped'].includes(needs.benchmark?.result)) failures.push('benchmark');
          if (failures.length) throw new Error(`required jobs did not pass: ${failures.join(', ')}`);
          NODE
