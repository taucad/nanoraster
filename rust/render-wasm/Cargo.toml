[package]
name = "render-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Forwards render-core's default-off benchmark surface; see its Cargo.toml.
[features]
bench = ["render-core/bench"]

[dependencies]
render-core = { path = "../render-core" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
