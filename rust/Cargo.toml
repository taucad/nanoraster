[workspace]
resolver = "2"
members = ["render-core", "render-wasm", "render-napi"]
exclude = ["vendor/image-webp", "vendor/wgpu-hal"]

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/taucad/nanoraster"

# Speed-first release profile: opt-level=z throttled the codec crates up to
# 7x (measured 2026-07-12; per-crate O3 overrides do not fully apply under fat
# LTO) and saved only about 21 KB against the 1.5 MB-gz wasm budget.
# panic stays "unwind" so napi-rs can contain panics instead of aborting Node.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# wgpu-hal 30.0.0 with one nanoraster patch: D3D12 pipeline state stream
# subobjects are pointer-aligned, not 8-byte aligned, so the DX12 backend can
# create pipelines on 32-bit Windows (win32-ia32-msvc). Remove once upstream
# gfx-rs/wgpu ships the fix; the vendored tree is otherwise the crates.io crate.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
